name: Create Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

concurrency:
  group: wporg-svn
  cancel-in-progress: true

permissions:
  contents: write
  # marvinpinto changelog calls listPullRequestsAssociatedWithCommit (private repos).
  pull-requests: read

jobs:
  # Multi-PHP matrix (7.4–8.4) + JS — create-release does not run if this fails.
  unit-tests:
    uses: ./.github/workflows/unit-tests-reusable.yml
    with:
      php-versions: '["7.4","8.0","8.1","8.2","8.3","8.4", "8.5"]'
      run-js: true

  create-release:
    name: Create Release
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify package.json and required scripts
        run: |
          test -f package.json || (echo "package.json is required" && exit 1)
          jq -e '.scripts["plugin-zip"]' package.json > /dev/null || (echo "plugin-zip script is required" && exit 1)
          jq -e '.scripts["lint"]' package.json > /dev/null || (echo "lint script is required" && exit 1)

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Read project name and version
        id: read_version
        run: |
          echo "project_name=$(jq -r '.name' package.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          npm ci
          npm run build --if-present

      - name: Convert README.md to WordPress readme.txt
        uses: everpress-co/action-md2wp@main

      - name: Remove Markdown readme before production zip
        run: rm -f README.md

      - name: Create production plugin zip
        run: npm run plugin-zip

      - name: Prepare deploy directory
        run: unzip "${{ steps.read_version.outputs.project_name }}.zip" -d deploy

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: false
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          BUILD_DIR: deploy/${{ steps.read_version.outputs.project_name }}
          # workflow_dispatch has no tag; tag pushes use github.ref_name so SVN matches the tag.
          VERSION: ${{ github.event_name == 'workflow_dispatch' && steps.read_version.outputs.version || github.ref_name }}

      - name: Create GitHub Release
        uses: marvinpinto/action-automatic-releases@v1.2.1
        if: ${{ !env.ACT && startsWith(github.ref, 'refs/tags/') }}
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          files: |
            ${{ steps.read_version.outputs.project_name }}.zip
